# Compila o mod e entrega o .jar pronto na aba Actions (Artifacts).
name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
        continue-on-error: true
      - name: javap (temporario)
        run: |
          J=$(find ~/.gradle/caches/fabric-loom -name 'minecraft-common*.jar' | head -1); echo $J
          C=$(find ~/.gradle/caches/fabric-loom -name 'minecraft-clientonly*.jar' | head -1)
          for k in net.minecraft.world.level.block.entity.SignText net.minecraft.world.level.block.entity.SignTextSlot net.minecraft.world.entity.SwingAnimation; do echo "##### $k"; javap -cp "$J" -public $k 2>&1 | head -60; done
          echo "##### SignBlockEntity"; javap -cp "$J" -public net.minecraft.world.level.block.entity.SignBlockEntity | grep -i "text\|front\|player\|update"
          echo "##### LivingEntity swing"; javap -cp "$J" -public net.minecraft.world.entity.LivingEntity | grep -i "swing"
          echo "##### Entity invul/drop"; javap -cp "$J" -public net.minecraft.world.entity.Entity | grep -i "invul\|drop\|spawnAtLocation"
          echo "##### Player drop"; javap -cp "$J" -public net.minecraft.world.entity.player.Player | grep -i "drop"
          echo "##### ServerPlayer drop"; javap -cp "$J" -public net.minecraft.server.level.ServerPlayer | grep -i "drop"
          echo "##### ArmorStand"; javap -cp "$J" -public net.minecraft.world.entity.decoration.ArmorStand | grep -i "invul\|marker\|hurt"
      - name: testes da lógica (apostas, pagamento, ranking)
        run: |
          GSON=$(find ~/.gradle -name 'gson-*.jar' ! -name '*sources*' | head -1)
          mkdir -p out
          javac -d out -cp "$GSON" src/main/java/br/melby/melbybet/core/*.java tests/br/melby/melbybet/core/Testes.java
          java -cp "out:$GSON" br.melby.melbybet.core.Testes
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: melbybet-jar
          path: build/libs/*.jar
