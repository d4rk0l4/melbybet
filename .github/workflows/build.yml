# Compila o mod e entrega o .jar pronto na aba Actions (Artifacts).
name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: javap (temporario)
        run: |
          MC=$(find ~/.gradle/caches/fabric-loom/26.3 -name 'minecraft-common*.jar' ! -name '*sources*' | head -1)
          for c in net.minecraft.world.item.MapItem net.minecraft.world.level.saveddata.maps.MapItemSavedData net.minecraft.world.level.saveddata.maps.MapId net.minecraft.world.level.saveddata.maps.MapDecoration net.minecraft.world.level.block.entity.BannerPatternLayers net.minecraft.world.level.block.entity.BannerPattern net.minecraft.world.entity.decoration.ArmorStand net.minecraft.core.Rotations net.minecraft.world.entity.decoration.ItemFrame net.minecraft.world.entity.decoration.HangingEntity net.minecraft.world.entity.player.Player; do echo "=== $c"; javap -cp "$MC" "$c" | grep -v "^  private" | head -80 || true; done
      - name: testes da lógica (apostas, pagamento, ranking)
        run: |
          GSON=$(find ~/.gradle -name 'gson-*.jar' ! -name '*sources*' | head -1)
          mkdir -p out
          javac -d out -cp "$GSON" src/main/java/br/melby/melbybet/core/*.java tests/br/melby/melbybet/core/Testes.java
          java -cp "out:$GSON" br.melby.melbybet.core.Testes
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: melbybet-jar
          path: build/libs/*.jar
