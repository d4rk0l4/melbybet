# Compila o mod e entrega o .jar pronto na aba Actions (Artifacts).
name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: javap (temporario)
        run: |
          for J in $(find ~/.gradle/caches -name '*.jar' -size +100k | head -400); do
            if unzip -l "$J" 2>/dev/null | grep -q 'net/minecraft/client/gui/screens/inventory/AbstractContainerScreen.class'; then CJ="$J"; fi
            if unzip -l "$J" 2>/dev/null | grep -q 'net/fabricmc/fabric/api/client/screen/v1/ScreenEvents.class'; then FJ="$J"; fi
          done
          echo "CJ=$CJ"; echo "FJ=$FJ"
          javap -p -cp "$CJ" net.minecraft.client.gui.screens.inventory.AbstractContainerScreen | cut -c1-190
          echo ==EDITBOX; javap -p -cp "$CJ" net.minecraft.client.gui.components.EditBox | cut -c1-190 | head -70
          echo ==SCREENEVENTS; javap -p -cp "$FJ" net.fabricmc.fabric.api.client.screen.v1.ScreenEvents 'net.fabricmc.fabric.api.client.screen.v1.ScreenEvents$AfterRender' 'net.fabricmc.fabric.api.client.screen.v1.Screens' | cut -c1-190
          echo ==SLOT; javap -p -cp "$CJ" net.minecraft.world.inventory.Slot | cut -c1-150 | head -30
      - name: testes da lógica (apostas, pagamento, ranking)
        run: |
          GSON=$(find ~/.gradle -name 'gson-*.jar' ! -name '*sources*' | head -1)
          mkdir -p out
          javac -d out -cp "$GSON" src/main/java/br/melby/melbybet/core/*.java tests/br/melby/melbybet/core/Testes.java
          java -cp "out:$GSON" br.melby.melbybet.core.Testes
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: melbybet-jar
          path: build/libs/*.jar
