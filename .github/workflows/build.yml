# Compila o mod e entrega o .jar pronto na aba Actions (Artifacts).
name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: javap (temporario)
        run: |
          CJ=/home/runner/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft/minecraft-clientonly-deobf/26.2/minecraft-clientonly-deobf-26.2.jar
          echo ==FILL; javap -p -cp "$CJ" net.minecraft.client.gui.GuiGraphicsExtractor | grep -i " fill\| outline\|renderOutline\|drawString\|text(" | cut -c1-190
          echo ==CI; javap -p -cp "$CJ" net.minecraft.world.inventory.ContainerInput | cut -c1-150
          echo ==SCREEN; javap -p -cp "$CJ" net.minecraft.client.gui.screens.Screen | grep -i "addRenderableWidget\|font\|setFocused\|public.*getFocused" | cut -c1-190
          echo ==BUTTON; javap -p -cp "$CJ" net.minecraft.client.gui.components.Button | grep -i "builder\|bounds\|build" | cut -c1-190
          javap -p -cp "$CJ" 'net.minecraft.client.gui.components.Button$Builder' | cut -c1-190
          echo ==SLOT; javap -p -cp "$CJ" net.minecraft.world.inventory.Slot | head -20 | cut -c1-150
          echo ==KEY; javap -p -cp "$CJ" net.minecraft.client.input.KeyEvent | cut -c1-150
      - name: testes da lógica (apostas, pagamento, ranking)
        run: |
          GSON=$(find ~/.gradle -name 'gson-*.jar' ! -name '*sources*' | head -1)
          mkdir -p out
          javac -d out -cp "$GSON" src/main/java/br/melby/melbybet/core/*.java tests/br/melby/melbybet/core/Testes.java
          java -cp "out:$GSON" br.melby.melbybet.core.Testes
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: melbybet-jar
          path: build/libs/*.jar
