# Compila o mod e entrega o .jar pronto na aba Actions (Artifacts).
name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: TEMP javap cliente
        continue-on-error: true
        shell: bash {0}
        run: |
          ./gradlew build -x test --no-daemon -q >/dev/null 2>&1
          G=~/.gradle/caches
          CP="$G/fabric-loom/minecraftMaven/net/minecraft/minecraft-clientonly-deobf/26.3/minecraft-clientonly-deobf-26.3.jar:$G/fabric-loom/minecraftMaven/net/minecraft/minecraft-common-deobf/26.3/minecraft-common-deobf-26.3.jar"
          echo "=== Minecraft screen"; javap -cp "$CP" -public net.minecraft.client.Minecraft | grep -i 'screen'
          echo "=== Gui"; javap -cp "$CP" -public net.minecraft.client.gui.Gui | grep -i 'overlay\|message\|actionbar\|screen\|setTitle\|chat'
          echo "=== InputConstants"; javap -cp "$CP" -public com.mojang.blaze3d.platform.InputConstants | grep -E ' KEY_(B|N|J|H);'
          echo "=== LocalPlayer msgs"; javap -cp "$CP" -public net.minecraft.client.player.LocalPlayer | grep -i 'message\|sendSystem\|overlay'
          echo "=== Player msgs"; javap -cp "$CP" -public net.minecraft.world.entity.player.Player | grep -i 'message\|sendSystem\|overlay'
      - name: build
        run: ./gradlew build
      - name: testes da lógica (apostas, pagamento, ranking)
        run: |
          GSON=$(find ~/.gradle -name 'gson-*.jar' ! -name '*sources*' | head -1)
          mkdir -p out
          javac -d out -cp "$GSON" src/main/java/br/melby/melbybet/core/*.java tests/br/melby/melbybet/core/Testes.java
          java -cp "out:$GSON" br.melby.melbybet.core.Testes
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: melbybet-jar
          path: build/libs/*.jar
