# Compila o mod e entrega o .jar pronto na aba Actions (Artifacts).
name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: javap (temporario)
        run: |
          J=$(find ~/.gradle/caches/fabric-loom -name 'minecraft-common*.jar' | head -1)
          N=$(find ~/.gradle -name 'fabric-networking-api-v1-*.jar' ! -name '*sources*' | head -1)
          echo "##### VillagerData"; javap -cp "$J" -public net.minecraft.world.entity.npc.villager.VillagerData | head -30
          echo "##### VillagerProfession"; javap -cp "$J" -public net.minecraft.world.entity.npc.villager.VillagerProfession | grep -i "NONE\|NITWIT"
          echo "##### PayloadTypeRegistry"; javap -cp "$N:$J" -public net.fabricmc.fabric.api.networking.v1.PayloadTypeRegistry | head -20
          echo "##### ServerPlayNetworking"; javap -cp "$N:$J" -public net.fabricmc.fabric.api.networking.v1.ServerPlayNetworking | grep -i "registerGlobalReceiver\|PlayPayloadHandler"
          javap -cp "$N:$J" -public 'net.fabricmc.fabric.api.networking.v1.ServerPlayNetworking$PlayPayloadHandler' 'net.fabricmc.fabric.api.networking.v1.ServerPlayNetworking$Context'
          echo "##### ClientPlayNetworking"; unzip -l "$N" | grep -i "ClientPlayNetworking.class"
          javap -cp "$N:$J" -public net.fabricmc.fabric.api.client.networking.v1.ClientPlayNetworking 2>&1 | grep -i " send\|canSend"
          echo "##### StreamCodec unit"; javap -cp "$J" -public net.minecraft.network.codec.StreamCodec | grep -i " unit"
      - name: testes da lógica (apostas, pagamento, ranking)
        run: |
          GSON=$(find ~/.gradle -name 'gson-*.jar' ! -name '*sources*' | head -1)
          mkdir -p out
          javac -d out -cp "$GSON" src/main/java/br/melby/melbybet/core/*.java tests/br/melby/melbybet/core/Testes.java
          java -cp "out:$GSON" br.melby.melbybet.core.Testes
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: melbybet-jar
          path: build/libs/*.jar
