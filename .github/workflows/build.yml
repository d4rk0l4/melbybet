# Compila o mod e entrega o .jar pronto na aba Actions (Artifacts).
name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: TEMP javap cliente
        continue-on-error: true
        shell: bash {0}
        run: |
          ./gradlew build -x test --no-daemon -q
          G=~/.gradle/caches
          MCJ="$G/fabric-loom/minecraftMaven/net/minecraft/minecraft-clientonly-deobf/26.3/minecraft-clientonly-deobf-26.3.jar:$G/fabric-loom/minecraftMaven/net/minecraft/minecraft-common-deobf/26.3/minecraft-common-deobf-26.3.jar"
          FJ=$(find $G/modules-2 -name 'fabric-*.jar' ! -name '*sources*' | tr '\n' ':')
          CP="$MCJ:$FJ"
          echo "=== GIZMO CLASSES"; for J in $(echo "$MCJ" | tr ':' ' '); do unzip -l $J | awk '{print $4}' | grep -i 'gizmo' ; done
          for C in net.fabricmc.fabric.api.client.rendering.v1.level.LevelRenderEvents 'net.fabricmc.fabric.api.client.rendering.v1.level.LevelRenderEvents$BeforeGizmos' net.minecraft.client.gui.GuiGraphicsExtractor net.minecraft.client.gui.components.EditBox net.minecraft.client.gui.components.AbstractWidget net.minecraft.client.gui.components.events.GuiEventListener net.minecraft.client.Options net.minecraft.client.Camera; do echo "=== $C"; javap -cp "$CP" -public "$C" 2>&1 | cut -c1-240 | head -140; done
          for C in $(for J in $(echo "$MCJ" | tr ':' ' '); do unzip -l $J | awk '{print $4}' | grep -i 'gizmo' | grep -v '\$' | sed 's/\.class$//;s#/#.#g'; done); do echo "=== $C"; javap -cp "$CP" -public "$C" 2>&1 | cut -c1-240 | head -60; done
      - name: build
        run: ./gradlew build
      - name: testes da lógica (apostas, pagamento, ranking)
        run: |
          GSON=$(find ~/.gradle -name 'gson-*.jar' ! -name '*sources*' | head -1)
          mkdir -p out
          javac -d out -cp "$GSON" src/main/java/br/melby/melbybet/core/*.java tests/br/melby/melbybet/core/Testes.java
          java -cp "out:$GSON" br.melby.melbybet.core.Testes
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: melbybet-jar
          path: build/libs/*.jar
