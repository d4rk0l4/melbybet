# Compila o mod e entrega o .jar pronto na aba Actions (Artifacts).
name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: javap (temporario)
        run: |
          J=$(find ~/.gradle/caches/fabric-loom -name 'minecraft-common*.jar' | head -1)
          C=$(find ~/.gradle/caches/fabric-loom -name 'minecraft-clientonly*.jar' | head -1)
          echo "##### Villager"; javap -cp "$J" -public net.minecraft.world.entity.npc.villager.Villager 2>&1 | grep -i "data\|xp\|offers\|trading\|level\|restock\|profession" | head -30
          echo "##### AbstractVillager"; javap -cp "$J" -public net.minecraft.world.entity.npc.villager.AbstractVillager 2>&1 | grep -i "offers\|trading" | head
          echo "##### find Villager"; unzip -l "$J" | grep -i "npc.*Villager\(Data\|Profession\)\?\.class"
          echo "##### MerchantMenu"; javap -cp "$J" -public net.minecraft.world.inventory.MerchantMenu | head -30
          echo "##### MerchantScreen"; javap -cp "$C" -public net.minecraft.client.gui.screens.inventory.MerchantScreen | head -20
          echo "##### CustomPacketPayload"; javap -cp "$J" -public 'net.minecraft.network.protocol.common.custom.CustomPacketPayload' 'net.minecraft.network.protocol.common.custom.CustomPacketPayload$Type' | head -20
          echo "##### fabric network jars"; find ~/.gradle -name 'fabric-networking-api*.jar' | head -3
      - name: testes da lógica (apostas, pagamento, ranking)
        run: |
          GSON=$(find ~/.gradle -name 'gson-*.jar' ! -name '*sources*' | head -1)
          mkdir -p out
          javac -d out -cp "$GSON" src/main/java/br/melby/melbybet/core/*.java tests/br/melby/melbybet/core/Testes.java
          java -cp "out:$GSON" br.melby.melbybet.core.Testes
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: melbybet-jar
          path: build/libs/*.jar
