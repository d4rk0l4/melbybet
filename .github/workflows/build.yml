# Compila o mod e entrega o .jar pronto na aba Actions (Artifacts).
name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: TEMP javap cliente
        continue-on-error: true
        shell: bash {0}
        run: |
          ./gradlew build -x test --no-daemon -q
          G=~/.gradle/caches
          MCJ="$G/fabric-loom/minecraftMaven/net/minecraft/minecraft-clientonly-deobf/26.3/minecraft-clientonly-deobf-26.3.jar:$G/fabric-loom/minecraftMaven/net/minecraft/minecraft-common-deobf/26.3/minecraft-common-deobf-26.3.jar"
          FJ=$(find $G/modules-2 -name 'fabric-*.jar' ! -name '*sources*' | tr '\n' ':')
          CP="$MCJ:$FJ"
          for J in $(echo "$FJ" | tr ':' ' ' | grep -i 'key-mapping\|rendering-v1\|screen-api\|client-networking\|networking-api'); do echo "=== JAR $(basename $J)"; unzip -l "$J" | awk '{print $4}' | grep '\.class$' | grep -v 'mixin\|/impl/\|internal' | head -80; done
          for C in net.minecraft.client.KeyMapping 'net.minecraft.client.KeyMapping$Category' net.minecraft.client.gui.screens.Screen net.minecraft.client.gui.GuiGraphics net.minecraft.client.gui.components.EditBox net.minecraft.client.gui.components.Button 'net.minecraft.client.gui.components.Button$Builder' net.minecraft.client.input.KeyEvent net.minecraft.client.input.MouseButtonEvent; do echo "=== $C"; javap -cp "$CP" -public "$C" 2>&1 | head -120; done
          echo "=== Minecraft fields"; javap -cp "$CP" -public net.minecraft.client.Minecraft 2>&1 | grep -i 'player\|level\|getInstance\|setScreen\|font\|gui\|getCameraEntity\|gameRenderer\|getWindow\|options\|getCurrentServer\|singleplayer'
          for C in $(unzip -l $(echo "$FJ" | tr ':' '\n' | grep -i 'rendering-v1' | head -1) | awk '{print $4}' | grep '\.class$' | grep -v 'mixin\|/impl/\|internal' | sed 's/\.class$//;s#/#.#g' | grep -i 'Hud\|LevelRender\|WorldRender' | head -12); do echo "=== $C"; javap -cp "$CP" -public "$C" 2>&1 | head -50; done
          for C in $(unzip -l $(echo "$FJ" | tr ':' '\n' | grep -i 'key-mapping' | head -1) | awk '{print $4}' | grep '\.class$' | grep -v 'mixin\|/impl/\|internal' | sed 's/\.class$//;s#/#.#g'); do echo "=== $C"; javap -cp "$CP" -public "$C" 2>&1 | head -30; done
          for C in net.fabricmc.fabric.api.client.networking.v1.ClientPlayNetworking net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents; do echo "=== $C"; javap -cp "$CP" -public "$C" 2>&1 | head -30; done
      - name: build
        run: ./gradlew build
      - name: testes da lógica (apostas, pagamento, ranking)
        run: |
          GSON=$(find ~/.gradle -name 'gson-*.jar' ! -name '*sources*' | head -1)
          mkdir -p out
          javac -d out -cp "$GSON" src/main/java/br/melby/melbybet/core/*.java tests/br/melby/melbybet/core/Testes.java
          java -cp "out:$GSON" br.melby.melbybet.core.Testes
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: melbybet-jar
          path: build/libs/*.jar
