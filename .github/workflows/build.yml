# Compila o mod e entrega o .jar pronto na aba Actions (Artifacts).
name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
        continue-on-error: true
      - name: javap (temporario)
        run: |
          J=$(find ~/.gradle/caches/fabric-loom -name 'minecraft-common*.jar' | head -1)
          for k in 'net.minecraft.world.level.block.entity.SignText$Mutable' net.minecraft.world.item.component.SwingAnimation net.minecraft.util.Prediction; do echo "##### $k"; javap -cp "$J" -public "$k" 2>&1 | head -30; done
          echo "##### Player drop"; javap -cp "$J" -public net.minecraft.world.entity.player.Player | grep -i " drop"
          echo "##### LE drop"; javap -cp "$J" -public net.minecraft.world.entity.LivingEntity | grep -i " drop"
          echo "##### swing enums"; unzip -l "$J" | grep -i "SwingAnimation"
      - name: testes da lógica (apostas, pagamento, ranking)
        run: |
          GSON=$(find ~/.gradle -name 'gson-*.jar' ! -name '*sources*' | head -1)
          mkdir -p out
          javac -d out -cp "$GSON" src/main/java/br/melby/melbybet/core/*.java tests/br/melby/melbybet/core/Testes.java
          java -cp "out:$GSON" br.melby.melbybet.core.Testes
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: melbybet-jar
          path: build/libs/*.jar
