name: probe
on:
  push:
    paths: ['probe/**']
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew classes
      - name: javap
        run: python3 probe/probe.py
